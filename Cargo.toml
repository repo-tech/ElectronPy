[workspace]
resolver = "2"
members = [
    "crates/electronpy-cli",
    "crates/electronpy-core",
    "crates/electronpy-ast",
    "crates/electronpy-parser",
    "crates/electronpy-types",
    "crates/electronpy-ir",
    "crates/electronpy-analysis",
    "crates/electronpy-optimizer",
    "crates/electronpy-codegen-rust",
    "crates/electronpy-tests",
]

[profile.dev]
incremental = true
codegen-units = 8
debug = 0
opt-level = 0

[profile.release]
opt-level = 2
codegen-units = 8
incremental = true
lto = "thin"
debug = 0
panic = "abort"
strip = "symbols"

[profile.release-fast]
inherits = "release"
opt-level = 3
codegen-units = 8
lto = false
panic = "abort"
strip = "symbols"
